<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My angularjs website</title>
    <link href="style.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
  </head>
  <body>

  <!-- 
  ng-app attribute tells angularjs that the div is the owner of the application
  ng-model binds the value of the input box to the application name
  ng-bind binds the contents of the <p> element to the application variable name

  so <p> will be whatever ng-model value is
  -->
    <div ng-app="">
      <p>What is your name?</p>
      <p>Name: <input type="text" ng-model="name" value=""></p>
      <p>Your name is: <span ng-bind="name"></span></p>
      
      <div ng-init="firstName='Ezra'">
        <p>Hey there! My name is <span ng-bind="firstName"></span></p>
      </div>
    </div> 
  
  </body>
</html>
